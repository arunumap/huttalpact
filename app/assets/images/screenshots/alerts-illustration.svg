<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#eaedf8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f7f9ff;stop-opacity:1"/>
    </linearGradient>
    <filter id="outerShadow" x="-6%" y="-4%" width="112%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000933" flood-opacity="0.10"/>
    </filter>
    <filter id="rowShadow" x="-4%" y="-10%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000933" flood-opacity="0.07"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#000933" opacity="0.035"/>
    </pattern>
  </defs>



  <!-- Main card: x=36, y=28, w=648, h=474 -->
  <rect x="36" y="28" width="648" height="474" rx="14" fill="url(#cardGrad)" filter="url(#outerShadow)"/>
  <rect x="36" y="28" width="648" height="5" rx="3" fill="#000933" opacity="0.07"/>

  <!--
    LAYOUT PLAN (all y from top of card at y=28):
    Header title:        y=28+22=50  → text baseline y=68
    Header subtitle:     text baseline y=84
    Alert Settings btn:  rect y=55, h=24, center y=67
    Divider:             y=96
    Section label row 1: center y=112  (upcoming)
    Alert row 1:         rect y=124, h=80, center y=164
    Section label row 2: center y=222  (scheduled)
    Alert row 2:         rect y=234, h=80, center y=274
    Alert row 3:         rect y=324, h=80, center y=364
    Card bottom:         324+80+20=424 → 28+424=452 fits in 474 ✓

    WITHIN each alert row (h=80):
      row top = R
      Icon circle center:  R+40  (vertically centered)
      Tag rect top:        R+12,  h=18, center R+21
      Tag text baseline:   R+23
      Main text baseline:  R+46
      Meta text baseline:  R+62
      Button rect top:     R+29,  h=22, center R+40
      Button text baseline:R+43
  -->

  <!-- ── HEADER ── -->
  <text x="64" y="68" font-size="18" font-weight="700" fill="#000933" letter-spacing="-0.4">Alerts</text>
  <text x="64" y="84" font-size="10" fill="#000933" opacity="0.38">Stay on top of contract renewals, expirations, and notice periods.</text>

  <!-- Alert Settings button: rect y=55, h=24, center=67 -->
  <rect x="546" y="55" width="120" height="24" rx="6" fill="none" stroke="#000933" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="560" cy="67" r="4.5" fill="none" stroke="#000933" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="560" cy="67" r="1.8" fill="#000933" opacity="0.3"/>
  <text x="569" y="71" font-size="8.5" fill="#000933" opacity="0.5">Alert Settings</text>

  <!-- Divider -->
  <line x1="64" y1="96" x2="656" y2="96" stroke="#000933" stroke-opacity="0.09" stroke-width="1"/>

  <!-- ── UPCOMING SECTION LABEL: center y=112 ── -->
  <!-- calendar icon: rect top=105, h=14 → center=112 -->
  <rect x="64" y="105" width="14" height="14" rx="2" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <line x1="68.5" y1="103" x2="68.5" y2="108" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="73.5" y1="103" x2="73.5" y2="108" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="64" y1="112" x2="78" y2="112" stroke="#2563eb" stroke-opacity="0.4" stroke-width="0.9"/>
  <text x="82" y="116" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="-0.2">Upcoming (1)</text>

  <!-- ══ ALERT ROW 1  R=124 ══ -->
  <rect x="50" y="124" width="620" height="80" rx="9" fill="white" filter="url(#rowShadow)"/>

  <!-- Icon circle center=164 -->
  <circle cx="80" cy="164" r="15" fill="#eff6ff"/>
  <path d="M76,161 Q76,156 80,156 Q84,156 84,161 L85.5,166 L74.5,166 Z" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linejoin="round"/>
  <line x1="74.5" y1="166" x2="85.5" y2="166" stroke="#2563eb" stroke-width="1.3"/>
  <path d="M79,167 Q80,169.5 81,167" fill="none" stroke="#2563eb" stroke-width="1.1"/>

  <!-- Tags: top=136, h=18, text baseline=148 -->
  <rect x="104" y="136" width="78" height="18" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="143" y="148" font-size="8.5" font-weight="700" fill="#d97706" text-anchor="middle">Expiry Warning</text>
  <rect x="188" y="136" width="62" height="18" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="219" y="148" font-size="8.5" font-weight="700" fill="#2563eb" text-anchor="middle">Upcoming</text>

  <!-- Buttons: top=153, h=22, center=164, text baseline=167 -->
  <rect x="528" y="153" width="52" height="22" rx="5" fill="none" stroke="#000933" stroke-opacity="0.2" stroke-width="1"/>
  <text x="554" y="167" font-size="8.5" fill="#000933" opacity="0.55" text-anchor="middle">Snooze</text>
  <rect x="586" y="153" width="72" height="22" rx="5" fill="#f59e0b"/>
  <text x="622" y="167" font-size="8.5" font-weight="700" fill="white" text-anchor="middle">Acknowledge</text>

  <!-- Main text baseline=170 -->
  <text x="104" y="170" font-size="10" font-weight="700" fill="#000933">Consulting Agreement expires in 16 days — Mar 12, 2026</text>
  <!-- Meta text baseline=185 -->
  <text x="104" y="185" font-size="8.5" font-weight="700" fill="#f59e0b">Consulting Agreement</text>
  <text x="212" y="185" font-size="8.5" fill="#000933" opacity="0.4">· Sage Foundry  · Due Feb 26, 2026</text>

  <!-- ── SCHEDULED SECTION LABEL: center y=222 ── -->
  <circle cx="71" cy="222" r="7" fill="none" stroke="#000933" stroke-opacity="0.4" stroke-width="1.4"/>
  <line x1="71" y1="218" x2="71" y2="222" stroke="#000933" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="71" y1="222" x2="74.5" y2="224.5" stroke="#000933" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="82" y="226" font-size="11" font-weight="700" fill="#000933" opacity="0.55" letter-spacing="-0.2">Scheduled (2)</text>

  <!-- ══ ALERT ROW 2  R=234 ══ -->
  <rect x="50" y="234" width="620" height="80" rx="9" fill="white" filter="url(#rowShadow)"/>

  <!-- Icon circle center=274 -->
  <circle cx="80" cy="274" r="15" fill="#f5f3ff"/>
  <circle cx="80" cy="274" r="7" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
  <line x1="80" y1="269" x2="80" y2="274" stroke="#7c3aed" stroke-width="1.3"/>
  <line x1="80" y1="274" x2="84" y2="277" stroke="#7c3aed" stroke-width="1.3"/>

  <!-- Tags: top=246, h=18, text baseline=258 -->
  <rect x="104" y="246" width="96" height="18" rx="9" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="152" y="258" font-size="8.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Notice Period Start</text>
  <rect x="206" y="246" width="62" height="18" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="237" y="258" font-size="8.5" font-weight="700" fill="#6b7280" text-anchor="middle">Scheduled</text>

  <!-- Buttons: top=263, h=22, center=274, text baseline=277 -->
  <rect x="528" y="263" width="52" height="22" rx="5" fill="none" stroke="#000933" stroke-opacity="0.2" stroke-width="1"/>
  <text x="554" y="277" font-size="8.5" fill="#000933" opacity="0.55" text-anchor="middle">Snooze</text>
  <rect x="586" y="263" width="72" height="22" rx="5" fill="#f59e0b"/>
  <text x="622" y="277" font-size="8.5" font-weight="700" fill="white" text-anchor="middle">Acknowledge</text>

  <!-- Main text baseline=280 -->
  <text x="104" y="280" font-size="9" font-weight="700" fill="#000933">Notice period for SaaS Agreement starts on Dec 11, 2026 — 60 days before Feb 9, 2027</text>
  <!-- Meta text baseline=295 -->
  <text x="104" y="295" font-size="8.5" font-weight="700" fill="#f59e0b">SaaS Agreement</text>
  <text x="185" y="295" font-size="8.5" fill="#000933" opacity="0.4">· Crestline Technology Partners, LLC  · Due Dec 11, 2026</text>

  <!-- ══ ALERT ROW 3  R=324 ══ -->
  <rect x="50" y="324" width="620" height="80" rx="9" fill="white" filter="url(#rowShadow)"/>

  <!-- Icon circle center=364 -->
  <circle cx="80" cy="364" r="15" fill="#f5f3ff"/>
  <circle cx="80" cy="364" r="7" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
  <line x1="80" y1="359" x2="80" y2="364" stroke="#7c3aed" stroke-width="1.3"/>
  <line x1="80" y1="364" x2="84" y2="367" stroke="#7c3aed" stroke-width="1.3"/>

  <!-- Tags: top=336, h=18, text baseline=348 -->
  <rect x="104" y="336" width="78" height="18" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="143" y="348" font-size="8.5" font-weight="700" fill="#d97706" text-anchor="middle">Expiry Warning</text>
  <rect x="188" y="336" width="62" height="18" rx="9" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="219" y="348" font-size="8.5" font-weight="700" fill="#6b7280" text-anchor="middle">Scheduled</text>

  <!-- Buttons: top=353, h=22, center=364, text baseline=367 -->
  <rect x="528" y="353" width="52" height="22" rx="5" fill="none" stroke="#000933" stroke-opacity="0.2" stroke-width="1"/>
  <text x="554" y="367" font-size="8.5" fill="#000933" opacity="0.55" text-anchor="middle">Snooze</text>
  <rect x="586" y="353" width="72" height="22" rx="5" fill="#f59e0b"/>
  <text x="622" y="367" font-size="8.5" font-weight="700" fill="white" text-anchor="middle">Acknowledge</text>

  <!-- Main text baseline=370 -->
  <text x="104" y="370" font-size="10" font-weight="700" fill="#000933">SaaS Agreement expires on Feb 9, 2027 (in 11 months)</text>
  <!-- Meta text baseline=385 -->
  <text x="104" y="385" font-size="8.5" font-weight="700" fill="#f59e0b">SaaS Agreement</text>
  <text x="185" y="385" font-size="8.5" fill="#000933" opacity="0.4">· Crestline Technology Partners, LLC  · Due Jan 26, 2027</text>

</svg>
