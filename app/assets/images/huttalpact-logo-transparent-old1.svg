<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 110 810 200" width="810" height="200">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E87B1A"/>
      <stop offset="50%" stop-color="#D4690F"/>
      <stop offset="100%" stop-color="#F09030"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4690F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E87B1A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D4690F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8E2EE"/>
      <stop offset="100%" stop-color="#C5D3E3"/>
    </linearGradient>
    <linearGradient id="page2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EAF3"/>
      <stop offset="100%" stop-color="#D4DEE8"/>
    </linearGradient>
    <linearGradient id="page3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F7"/>
      <stop offset="100%" stop-color="#E4EBF2"/>
    </linearGradient>
    <linearGradient id="keylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F09030"/>
      <stop offset="40%" stop-color="#E87B1A"/>
      <stop offset="100%" stop-color="#D4690F"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="keyglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pageShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#4A6080" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- No background - transparent -->

  <!-- Layered Pages Icon -->
  <g transform="translate(55, 120) scale(0.55)">
    <g transform="rotate(-6, 110, 140)">
      <rect x="35" y="25" width="150" height="200" rx="6" fill="url(#page1)" stroke="#A8BBCF" stroke-width="1.2"/>
      <line x1="55" y1="65" x2="155" y2="65" stroke="#9BB0C8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="55" y1="85" x2="140" y2="85" stroke="#9BB0C8" stroke-width="1" stroke-linecap="round"/>
      <line x1="55" y1="105" x2="148" y2="105" stroke="#9BB0C8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="rotate(-2, 110, 140)">
      <rect x="35" y="25" width="150" height="200" rx="6" fill="url(#page2)" stroke="#B0C2D5" stroke-width="1.2"/>
      <line x1="55" y1="65" x2="155" y2="65" stroke="#A3B5CA" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="55" y1="85" x2="135" y2="85" stroke="#A3B5CA" stroke-width="1" stroke-linecap="round"/>
      <line x1="55" y1="105" x2="150" y2="105" stroke="#A3B5CA" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="55" y1="125" x2="120" y2="125" stroke="#A3B5CA" stroke-width="1" stroke-linecap="round"/>
    </g>
    <g filter="url(#pageShadow)">
      <rect x="35" y="25" width="150" height="200" rx="6" fill="url(#page3)" stroke="#B8C8DA" stroke-width="1.5"/>
      <line x1="55" y1="60" x2="155" y2="60" stroke="#8EA4BC" stroke-width="2" stroke-linecap="round"/>
      <line x1="55" y1="80" x2="130" y2="80" stroke="#9AB0C5" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="55" y1="100" x2="148" y2="100" stroke="#8EA4BC" stroke-width="2" stroke-linecap="round"/>
      <line x1="55" y1="120" x2="115" y2="120" stroke="#9AB0C5" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="55" y1="140" x2="140" y2="140" stroke="#9AB0C5" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <line x1="55" y1="185" x2="110" y2="185" stroke="#8098B2" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
      <circle cx="125" cy="185" r="2" fill="#8098B2" opacity="0.4"/>
    </g>
    <g filter="url(#keyglow)">
      <line x1="42" y1="20" x2="42" y2="235" stroke="url(#keylineGrad)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <line x1="42" y1="20" x2="42" y2="235" stroke="#E87B1A" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="42" cy="50" r="5" fill="#EEF2F7" stroke="#F09030" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="50" r="2" fill="#E87B1A"/>
    <circle cx="42" cy="125" r="5" fill="#EEF2F7" stroke="#E87B1A" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="125" r="2" fill="#D4690F"/>
    <circle cx="42" cy="200" r="5" fill="#EEF2F7" stroke="#D4690F" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="200" r="2" fill="#D4690F"/>
    <line x1="35" y1="125" x2="190" y2="125" stroke="#E87B1A" stroke-width="0.5" opacity="0.25">
      <animate attributeName="y1" values="50;200;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="50;200;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.08;0.25" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Text: HuttalPact -->
  <text x="230" y="210" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-size="82" letter-spacing="2">
    <tspan font-weight="900" fill="#1A1D24">Huttal</tspan><tspan font-weight="900" fill="url(#orangeGrad)">Pact</tspan>
  </text>

  <!-- Separator line -->
  <line x1="230" y1="230" x2="820" y2="230" stroke="url(#glowLine)" stroke-width="1.5" filter="url(#softglow)"/>

  <!-- Tagline: Contracts Decoded -->
  <text x="230" y="273" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="26" fill="#A0683A" letter-spacing="12">CONTRACTS DECODED</text>

  <!-- Subtle decorative dots -->
  <g opacity="0.2">
    <circle cx="230" cy="300" r="1.5" fill="#E87B1A"/>
    <circle cx="250" cy="300" r="1.5" fill="#E87B1A"/>
    <circle cx="270" cy="300" r="1.5" fill="#E87B1A"/>
  </g>
</svg>
