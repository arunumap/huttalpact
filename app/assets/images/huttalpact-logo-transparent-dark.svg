<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="680" height="130">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E87B1A"/>
      <stop offset="50%" stop-color="#D4690F"/>
      <stop offset="100%" stop-color="#F09030"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4690F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E87B1A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D4690F" stop-opacity="0"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- No background - transparent -->

  <!-- Text: HuttalPact -->
  <text x="340" y="68" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-size="82" letter-spacing="2" text-anchor="middle">
    <tspan font-weight="900" fill="#FFFFFF">Huttal</tspan><tspan font-weight="900" fill="url(#orangeGrad)">Pact</tspan>
  </text>

  <!-- Separator line -->
  <line x1="20" y1="85" x2="660" y2="85" stroke="url(#glowLine)" stroke-width="1.5" filter="url(#softglow)"/>

  <!-- Tagline: Contracts Decoded -->
  <text x="340" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="24" fill="#D4A574" letter-spacing="12" text-anchor="middle">CONTRACTS DECODED</text>
</svg>
